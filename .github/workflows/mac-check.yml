name: Mac check
# Builds the macOS app on a real Mac runner, runs the built-in smoke test, and publishes screenshots to the mac-shots branch.
on:
  workflow_dispatch:
  push:
    branches: ['mactest']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJULRETSU_BUILD_GUI=ON -DJULRETSU_BUILD_TESTS=OFF -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
      - name: Build
        run: cmake --build build --parallel 3
      - name: Smoke test and screenshots
        continue-on-error: true
        run: |
          mkdir -p shots
          system_profiler SPDisplaysDataType 2>&1 | head -20 || true
          ./build/Julretsu.app/Contents/MacOS/Julretsu --smoke --capture-prefix shots/julretsu > shots/out.txt 2> shots/err.txt; echo "exit code $?" >> shots/out.txt
          cat shots/out.txt shots/err.txt
          for f in workspace dark lua-en korean; do sips -s format png "shots/julretsu-$f.bmp" --out "shots/$f.png" || true; done
          grep -E "display:|PASS|FAIL|exit code" shots/out.txt | while IFS= read -r line; do echo "::notice::$line"; done
          head -5 shots/err.txt | while IFS= read -r line; do echo "::warning::$line"; done
      - name: Publish screenshots to the mac-shots branch
        run: |
          mkdir out
          cp shots/*.png shots/out.txt shots/err.txt out/ 2>/dev/null || true
          cd out
          git init -q && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git checkout -q -b mac-shots && git add -A && git commit -q -m "Mac check ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mac-shots
