name: Headless core
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        profile: [core, lua]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJULRETSU_BUILD_BENCHMARKS=ON -DJULRETSU_ENABLE_LUA=${{ matrix.profile == 'lua' && 'ON' || 'OFF' }}
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DJULRETSU_ENABLE_SANITIZERS=ON -DJULRETSU_ENABLE_LUA=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
